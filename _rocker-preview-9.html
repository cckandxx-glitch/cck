<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R 开关 · 定尺寸</title>
<style>
:root{
  --bg:#212121; --side:#282828; --pill:#2c2c2c; --line:rgba(255,255,255,.08);
  --ink:#fff; --ink2:#e2e2e5; --mute:#97979e;
  --ok:#8bd5a8; --red:#c8372d;
  --font:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
  --slow:1; --u:1px;
}
body{margin:0;background:var(--bg);color:var(--ink2);font:14px/1.5 var(--font);padding:24px 16px 60px}
h1{font-size:22px;color:var(--ink);margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 18px;font-size:13px;max-width:920px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:22px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;background:var(--pill);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.lab{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,760px);gap:14px}
.card{background:var(--side);border-radius:12px;padding:16px 16px 14px;display:flex;flex-direction:column}
.card h2{margin:0;font-size:15px;color:var(--ink);font-weight:600}
.card h2 b{display:inline-block;width:30px;color:var(--mute);font-weight:600}
.card .src{margin:4px 0 0 30px;color:var(--ink2);font-size:12.5px}
.card p{margin:4px 0 0 30px;color:var(--mute);font-size:12.5px;min-height:74px}
.stage{height:170px;display:flex;align-items:center;justify-content:center}
.stage .sx{--u:calc(var(--k)*2.5px)}
.cap{color:var(--mute);font-size:12px;text-align:center;margin-top:6px}
.hd{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#303030;border-radius:8px;margin-top:6px}
.hd .t{font-size:13.5px;font-weight:500;color:var(--ink);margin-right:8px;white-space:nowrap}
.hd .g{flex:1}
.hd .ic{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;padding:0}
.hd .ic:hover{background:#2f2f2f;color:var(--ink)}
.hd .sx{--u:calc(var(--k)*1px);margin-left:4px}
.tip{color:var(--mute);font-size:12px;margin:6px 2px 0;min-height:18px}
.tip b{font-weight:500;color:var(--ink2)}

/* ============ 共用 ============
   按 32px 高画；--k 是缩放（28 / 32 / 36 三档）。
   颜色分工：红只给急停，而且一直是红的；I 亮绿；O 亮白（红让给急停了，关不再用红）。 */
body{--k:1}
.sx{--dur:170ms;--ease:cubic-bezier(.4,0,.2,1);--on:var(--ok);--off:#e8e8ea;
  position:relative;display:inline-block;box-sizing:border-box;height:calc(32*var(--u));border-radius:calc(9*var(--u));
  background:#232323;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);cursor:pointer;flex:none;line-height:0;user-select:none;-webkit-tap-highlight-color:transparent}
.sx:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
.mk{position:absolute;top:50%;left:var(--x);transform:translate(-50%,-50%);color:var(--c,#7d7d84);transition:color calc(var(--dur)*var(--slow)) var(--ease)}
.gI{width:calc(2*var(--u));height:calc(10*var(--u));border-radius:var(--u);background:currentColor}
.gO{width:calc(10*var(--u));height:calc(10*var(--u));border-radius:50%;box-sizing:border-box;border:calc(2*var(--u)) solid currentColor}
.gS{width:calc(9*var(--u));height:calc(9*var(--u));border-radius:calc(1.5*var(--u));background:currentColor}
.sx[data-p="0"] .gO{--c:var(--off)}
.sx[data-p="1"] .gI,.sx[data-p="2"] .gI{--c:var(--on)}
.sx.boot .gI{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
@keyframes nudge{30%{transform:translateX(calc(2*var(--u)))}70%{transform:translateX(calc(-1*var(--u)))}}
.sx.deny .stp{animation:nudge .22s ease}
/* 急停：一直红；按下去时颜色压深、往里沉，停完才弹起 */
.stp{background:var(--red);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 1px rgba(0,0,0,.4);transition:background-color calc(var(--dur)*var(--slow)) var(--ease),transform calc(var(--dur)*var(--slow)) var(--ease),box-shadow calc(var(--dur)*var(--slow)) var(--ease)}
.sx[data-p="2"] .stp{background:#9e2b23;box-shadow:inset 0 calc(2*var(--u)) calc(3*var(--u)) rgba(0,0,0,.45);animation:sink 1s ease-in-out infinite}
@keyframes sink{50%{background:#c8372d}}
.sx.nostop .stp{cursor:default}

/* P 选择开关（德国电柜那一路：西门子 / 博朗）
   一条轨道三格：O · I 两格走滑块，最右一格是固定的红色急停键 */
.P{width:calc(96*var(--u));padding:calc(3*var(--u))}
.P .act{position:absolute;top:calc(3*var(--u));bottom:calc(3*var(--u));left:calc(3*var(--u));width:calc(30*var(--u));border-radius:calc(6*var(--u));
  background:#4b4b4b;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 1px rgba(0,0,0,.4);
  transform:translateX(calc(var(--s)*30*var(--u)));transition:transform calc(var(--dur)*var(--slow)) var(--ease)}
.P .gO{--x:calc(18*var(--u))} .P .gI{--x:calc(48*var(--u))}
.P .stp{position:absolute;top:calc(3*var(--u));bottom:calc(3*var(--u));right:calc(3*var(--u));width:calc(30*var(--u));border-radius:calc(6*var(--u));display:grid;place-items:center}
.P .div{position:absolute;top:calc(7*var(--u));bottom:calc(7*var(--u));left:calc(63*var(--u));width:1px;background:rgba(255,255,255,.08)}

/* Q 刻度盘旋钮（瑞士 / 德国凸轮开关那一路）
   一颗带指针的圆钮，左边刻 O、上方是 I；右边一块红色扇区就是急停位 */
.Q{width:calc(84*var(--u))}
.Q .act{position:absolute;top:calc(3*var(--u));left:calc(23*var(--u));width:calc(26*var(--u));height:calc(26*var(--u));border-radius:50%;
  background:#4b4b4b;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45);
  transform:rotate(var(--r));transition:transform calc(var(--dur)*var(--slow)) var(--ease);z-index:1}
.Q .act::after{content:"";position:absolute;left:50%;top:calc(2.5*var(--u));width:calc(3*var(--u));height:calc(10*var(--u));margin-left:calc(-1.5*var(--u));border-radius:calc(1.5*var(--u));
  background:var(--ptr);transition:background-color calc(var(--dur)*var(--slow)) var(--ease)}
.Q[data-p="0"]{--r:-90deg;--ptr:var(--off)} .Q[data-p="1"]{--r:0deg;--ptr:var(--on)} .Q[data-p="2"]{--r:90deg;--ptr:#fff}
.Q.boot .act::after{animation:blink 1s ease-in-out infinite}
.Q .gO{--x:calc(11*var(--u))} .Q .gI{display:none}
.Q .stp{position:absolute;top:calc(3*var(--u));bottom:calc(3*var(--u));right:calc(3*var(--u));width:calc(40*var(--u));border-radius:calc(13*var(--u)) calc(6*var(--u)) calc(6*var(--u)) calc(13*var(--u));display:grid;place-items:center;padding-left:calc(12*var(--u));box-sizing:border-box}
.Q[data-p="2"] .stp{animation:sink 1s ease-in-out infinite}

/* R 急停蘑菇钮 + 转环（急停钮本身就带旋转释放：德国、日本的急停钮都是这个结构）
   中间红钮按下 = 急停；外圈转环左指 O、右指 I */
.R{width:calc(84*var(--u))}
.R .act{position:absolute;top:calc(2*var(--u));left:calc(28*var(--u));width:calc(28*var(--u));height:calc(28*var(--u));border-radius:50%;
  background:#4b4b4b;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 2px rgba(0,0,0,.45);transform:rotate(var(--r));transition:transform calc(var(--dur)*var(--slow)) var(--ease)}
.R .act::after{content:"";position:absolute;left:50%;top:calc(.5*var(--u));width:calc(3*var(--u));height:calc(4*var(--u));margin-left:calc(-1.5*var(--u));border-radius:calc(1*var(--u));background:var(--ptr)}
.R[data-p="0"]{--r:-90deg;--ptr:var(--off)} .R[data-p="1"],.R[data-p="2"]{--r:90deg;--ptr:var(--on)}
.R .stp{position:absolute;top:calc(7*var(--u));left:calc(33*var(--u));width:calc(18*var(--u));height:calc(18*var(--u));border-radius:50%}
.R[data-p="2"] .stp{transform:scale(.9)}
.R{--off:#ff7b72}   /* 10-05 用户定：R 关的时候 O 圈亮红 */
.R .gO{--x:calc(13*var(--u))} .R .gI{--x:calc(71*var(--u))}
</style>
</head>
<body>
<h1>R 开关 · 定尺寸</h1>
<p class="sub">拖上面的滑杆或直接填数字，下面顶栏里的开关跟着变，宽度按比例走。每一格 0.8px＝125% 缩放下 1 个设备像素，不会出现半像素虚边。定下来告诉我高度数字就行。</p>

<div class="bar">
  <span class="lab">高度</span>
  <input id="kr" type="range" min="20" max="48" step="0.8" value="32" style="width:260px">
  <input id="kn" type="number" min="20" max="48" step="0.8" value="32" style="width:64px;background:#2c2c2c;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:3px 6px;font:inherit">
  <span class="lab" id="kout"></span>
  <span class="lab">模拟</span>
  <span class="seg" id="busy"><button data-v="0" class="on">空闲</button><button data-v="1">有任务在跑</button></span>
  <span class="lab">速度</span>
  <span class="seg" id="slow"><button data-v="1" class="on">正常</button><button data-v="5">慢放 ×5</button></span>
</div>

<div class="grid" id="grid"></div>

<script>
const V = [
  ['R', '急停钮加转环', '参考：德国、日本急停钮的结构（红色蘑菇头，外面一圈旋转环）。', '正中一颗红色急停钮，外面一圈转环，环上的小指针指左是关、指右是开。急停最像真的急停，三个功能长在同一个钮上。'],
];
const GEAR = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>';
const SQ = '<i class="gS" style="color:#fff"></i>';
const body = {
  P: `<span class="act"></span><i class="div"></i><i class="mk gO"></i><i class="mk gI"></i><span class="stp">${SQ}</span>`,
  Q: `<span class="stp">${SQ}</span><span class="act"></span><i class="mk gO"></i><i class="mk gI"></i>`,
  R: `<span class="act"></span><span class="stp"></span><i class="mk gO"></i><i class="mk gI"></i>`,
};
const sx = (v) => `<span class="sx ${v}" role="group" tabindex="0" aria-label="AI 电源和急停">${body[v]}</span>`;
document.getElementById('grid').innerHTML = V.map(([v, n, s, d]) => `<div class="card" data-v="${v}"><h2><b>${v}</b>${n}</h2><div class="src">${s}</div><p>${d}</p><div class="stage">${sx(v)}</div><div class="hd"><span class="t">对话</span><span class="g"></span><button class="ic" title="设置">${GEAR}</button>${sx(v)}</div><div class="tip"></div><div class="cap">↑ 顶栏实际大小</div></div>`).join('');

const S = {}; let busy = false;
const get = (v) => S[v] || (S[v] = { pw: 'off', stopping: false, t: 0 });
function paint(card) {
  const v = card.dataset.v, s = get(v), on = s.pw !== 'off', p = s.stopping ? 2 : on ? 1 : 0;
  card.querySelectorAll('.sx').forEach((x) => {
    x.dataset.p = p; x.style.setProperty('--s', on ? 1 : 0);
    x.classList.toggle('boot', s.pw === 'boot');
    x.classList.toggle('nostop', !(on && busy));
    x.title = s.stopping ? '正在急停…' : s.pw === 'boot' ? 'AI 上线中…' : (on ? 'AI 已上线' : 'AI 已下线') + (on && busy ? ' · 有任务在跑，按红键急停' : '');
  });
  card.querySelector('.tip').innerHTML = '状态：<b>' + (s.stopping ? '正在急停…' : s.pw === 'boot' ? 'AI 上线中…' : on ? 'AI 已上线' : 'AI 已下线') + '</b>' + (on && busy && !s.stopping ? ' · 有任务在跑' : '');
}
const paintAll = () => document.querySelectorAll('.card').forEach(paint);
function deny(x) { x.classList.remove('deny'); void x.offsetWidth; x.classList.add('deny'); }
function go(card, x, pos) {
  const v = card.dataset.v, s = get(v);
  if (s.stopping) return;
  if (pos === 0 && s.pw !== 'off') { clearTimeout(s.t); s.pw = 'off'; }
  else if (pos === 1 && s.pw === 'off') { s.pw = 'boot'; s.t = setTimeout(() => { s.pw = 'on'; paint(card); }, 3000); }
  else if (pos === 2) {
    if (s.pw === 'off' || !busy) return deny(x);
    s.stopping = true; setTimeout(() => { s.stopping = false; busy = false; setBusySeg(); paintAll(); }, 1500);
  }
  paint(card);
}
function setBusySeg() { document.querySelectorAll('#busy button').forEach((b) => b.classList.toggle('on', b.dataset.v === (busy ? '1' : '0'))); }
paintAll();
function setH(h) {
  h = Math.min(48, Math.max(20, Math.round(h / .8) * .8));
  document.body.style.setProperty('--k', h / 32);
  document.getElementById('kr').value = h; document.getElementById('kn').value = +h.toFixed(1);
  document.getElementById('kout').textContent = '高 ' + +h.toFixed(1) + 'px · 宽 ' + +(h * 84 / 32).toFixed(1) + 'px（125% 缩放下 ' + Math.round(h * 1.25) + ' 设备像素高）';
}
document.getElementById('kr').oninput = (e) => setH(+e.target.value);
document.getElementById('kn').onchange = (e) => setH(+e.target.value);
setH(32);

document.addEventListener('click', (e) => {
  const x = e.target.closest('.sx');
  if (x) {
    const card = x.closest('.card'), r = x.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
    let pos;
    if (e.target.closest('.stp')) pos = 2;
    else if (x.classList.contains('P')) pos = f < 63 / 96 ? (f < 33 / 96 ? 0 : 1) : 2;
    else if (x.classList.contains('Q')) pos = f < 23 / 84 ? 0 : 1;
    else pos = f < .5 ? 0 : 1;
    go(card, x, pos); return;
  }
  const b = e.target.closest('.seg button'); if (!b) return;
  b.parentNode.querySelectorAll('button').forEach((y) => y.classList.toggle('on', y === b));
  const id = b.parentNode.id, val = b.dataset.v;
  if (id === 'slow') document.documentElement.style.setProperty('--slow', val);
  else if (id === 'busy') busy = val === '1';
  paintAll();
});
document.addEventListener('keydown', (e) => {
  const x = e.target.closest && e.target.closest('.sx'); if (!x) return;
  const card = x.closest('.card');
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(card, x, 0); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); go(card, x, 1); }
  else if (e.key === 'Escape') { e.preventDefault(); go(card, x, 2); }
});
</script>
</body>
</html>
